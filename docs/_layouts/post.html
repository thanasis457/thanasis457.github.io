---
layout: default
---
<script>
MathJax = {
tex: {
    inlineMath: {'[+]': [['$', '$']]},
    tags: 'none'
}
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml.js"></script>
<h1>{{ page.title }}</h1>
<p style="margin-bottom: 0;">{{ page.date | date_to_string }} - {{ page.author }}</p>
{% if page.updated %}
<p style="margin-top: 0; font-size: 0.85rem;"><em>Updated:</em> {{ page.updated | date_to_string }}</p>
{% endif %}

{{ content }}
